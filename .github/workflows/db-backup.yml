name: DB Backup

on:
  schedule:
    # 18:30 UTC = 00:00 IST — daily, off-peak.
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve date + S3 key
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          PREFIX="${{ secrets.AWS_S3_BACKUP_PREFIX }}"
          PREFIX="${PREFIX:-db-backups}"
          PREFIX="${PREFIX#/}"; PREFIX="${PREFIX%/}"
          {
            echo "today=$TODAY"
            echo "prefix=$PREFIX"
            echo "key=$PREFIX/$TODAY.dump"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_OUTPUT"

      - name: pg_dump → file
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DB_BACKUP_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL \
            -e PGCONNECT_TIMEOUT=15 \
            -v "$PWD":/work -w /work \
            postgres:17-alpine \
            sh -c 'pg_dump --no-owner --no-privileges --format=custom "$DATABASE_URL" > backup.dump' \
            2> dump.log

          SIZE=$(stat -c %s backup.dump)
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup file suspiciously small ($SIZE bytes) — likely failed"
            tail -50 dump.log || true
            exit 1
          fi
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_S3_REGION }}
          BUCKET:                ${{ secrets.AWS_S3_BUCKET }}
          KEY:                   ${{ steps.meta.outputs.key }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp backup.dump "s3://$BUCKET/$KEY" \
            --content-type application/octet-stream \
            --no-progress

      - name: Prune backups (keep newest 3)
        id: prune
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_S3_REGION }}
          BUCKET:                ${{ secrets.AWS_S3_BUCKET }}
          PREFIX:                ${{ steps.meta.outputs.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          # Errors are NOT suppressed. If this reports zero objects right
          # after a successful upload, the IAM user is almost certainly
          # missing s3:ListBucket on the prefix.
          aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "$PREFIX/" \
            --query 'Contents[].Key' \
            --output text > raw-keys.txt

          # aws prints the literal string "None" when Contents is null
          # (genuinely empty bucket). Treat that as zero matches.
          if [ ! -s raw-keys.txt ] || grep -qx "None" raw-keys.txt; then
            : > all-keys.txt
          else
            tr '\t' '\n' < raw-keys.txt | grep -E '\.dump$' | sort -r > all-keys.txt
          fi

          TOTAL=$(wc -l < all-keys.txt | tr -d ' ')
          KEEP=3
          echo "Found $TOTAL backup objects under $PREFIX/"

          DELETED_FILE=$(mktemp)
          : > "$DELETED_FILE"
          if [ "$TOTAL" -gt "$KEEP" ]; then
            tail -n +"$((KEEP+1))" all-keys.txt > "$DELETED_FILE"
            while IFS= read -r K; do
              [ -z "$K" ] && continue
              echo "Pruning: $K"
              aws s3 rm "s3://$BUCKET/$K"
            done < "$DELETED_FILE"
          fi

          # Endpoint queries S3 itself for the kept list + timestamps +
          # presigned download URLs, so we only need to forward the list
          # of keys that were just removed (those won't be in S3 anymore).
          PRUNED_JSON=$(jq -R . < "$DELETED_FILE" | jq -s -c .)
          {
            echo "found=$TOTAL"
            echo "pruned_json=$PRUNED_JSON"
          } >> "$GITHUB_OUTPUT"

      - name: Notify success
        if: success()
        shell: bash
        env:
          APP_URL:      ${{ secrets.APP_URL }}
          CRON_SECRET:  ${{ secrets.CRON_SECRET }}
          TODAY:        ${{ steps.meta.outputs.today }}
          KEY:          ${{ steps.meta.outputs.key }}
          SIZE:         ${{ steps.dump.outputs.size }}
          PRUNED_JSON:  ${{ steps.prune.outputs.pruned_json }}
          RUN_URL:      ${{ steps.meta.outputs.run_url }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg status "ok" \
            --arg today  "$TODAY" \
            --arg key    "$KEY" \
            --argjson size "$SIZE" \
            --argjson pruned "$PRUNED_JSON" \
            --arg runUrl "$RUN_URL" \
            '{ status:$status, today:$today, key:$key, size:$size, pruned:$pruned, runUrl:$runUrl }')
          curl --fail-with-body --show-error --silent --retry 3 --retry-delay 5 \
            -X POST "${APP_URL%/}/api/cron/backup-notify" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify failure
        if: failure()
        shell: bash
        env:
          APP_URL:     ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TODAY:       ${{ steps.meta.outputs.today }}
          RUN_URL:     ${{ steps.meta.outputs.run_url }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -nc \
            --arg status "fail" \
            --arg today  "$TODAY" \
            --arg runUrl "$RUN_URL" \
            '{ status:$status, today:$today, runUrl:$runUrl }')
          curl --fail-with-body --show-error --silent --retry 3 --retry-delay 5 \
            -X POST "${APP_URL%/}/api/cron/backup-notify" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
